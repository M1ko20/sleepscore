name: SleepApp
options:
  bundleIdPrefix: cz.mikolas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
targets:
  SleepApp:
    type: application
    platform: iOS
    sources: [SleepApp]
    dependencies:
      - package: Supabase
      - sdk: HealthKit.framework
    entitlements:
      path: SleepApp/SleepApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.mikolas.sleepscore
        PRODUCT_NAME: SleepApp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
      configs:
        # Zápis do Zdraví jen v Debug (DebugHealthSeeder). Release o zápis nežádá (issue #8).
        Debug:
          GENERATE_INFOPLIST_FILE: YES
          INFOPLIST_KEY_NSHealthUpdateUsageDescription: Jen testovací build zapisuje do Apple Health vzorová data.
    info:
      path: SleepApp/Info.plist
      properties:
        CFBundleDisplayName: Sleepscore
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Čteme jen spánek a tep z hodinek nebo prstenu. Nic dalšího a nic do reklamy.
        SupabaseURL: $(SUPABASE_URL)
        SupabaseKey: $(SUPABASE_KEY)
