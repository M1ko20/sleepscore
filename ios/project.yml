name: SleepApp
options:
  bundleIdPrefix: cz.mikolas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Appka je česky (systémové prvky – Zpět, Sign in with Apple – taky). Angličtina jen pro texty v Info.plist (#22).
  developmentLanguage: cs
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
# Podepisování: tým z Apple Developer Programu (Team ID není tajné). Profily spravuje Xcode sám.
settings:
  base:
    DEVELOPMENT_TEAM: UV56DGQ2BR
    CODE_SIGN_STYLE: Automatic
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
targets:
  SleepApp:
    type: application
    platform: iOS
    sources: [SleepApp]
    dependencies:
      - package: Supabase
      - sdk: HealthKit.framework
    entitlements:
      path: SleepApp/SleepApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.applesignin: [Default]
        # Push (#10). Při exportu pro TestFlight/App Store Xcode přepne na production.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.mikolas.bedrival
        PRODUCT_NAME: SleepApp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
    info:
      path: SleepApp/Info.plist
      properties:
        CFBundleDisplayName: Bedrival
        # Launch screen v barvě pozadí appky (bg #0B0D12) s logem uprostřed, ať při startu nebliká bílá (#16).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: false
        # Jen HTTPS (standardní šifrování OS) – App Store Connect se pak neptá u každého buildu (#24).
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Čteme jen spánek a tep z hodinek nebo prstenu. Nic dalšího a nic do reklamy.
        # App Store Connect ho chce kvůli HealthKit entitlementu, i když Release o zápis nežádá (#8).
        # O zápis žádá jen Debug build (DebugHealthSeeder v simulátoru).
        NSHealthUpdateUsageDescription: Bedrival do Apple Health nic nezapisuje. Jen testovací verze vkládá vzorovou noc.
        SupabaseURL: $(SUPABASE_URL)
        SupabaseKey: $(SUPABASE_KEY)
  # UI testy (XCUITest): ruční test #13 a průchod appkou na promo video.
  SleepAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SleepAppUITests]
    dependencies:
      - target: SleepApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.mikolas.bedrival.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        TEST_TARGET_NAME: SleepApp
schemes:
  SleepApp:
    build:
      targets:
        SleepApp: all
        SleepAppUITests: [test]
    test:
      targets: [SleepAppUITests]
