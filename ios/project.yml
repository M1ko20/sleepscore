name: SleepApp
options:
  bundleIdPrefix: cz.mikolas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Appka je česky (systémové prvky – Zpět, Sign in with Apple – taky). Angličtina jen pro texty v Info.plist (#22).
  developmentLanguage: cs
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
targets:
  SleepApp:
    type: application
    platform: iOS
    sources: [SleepApp]
    dependencies:
      - package: Supabase
      - sdk: HealthKit.framework
    entitlements:
      path: SleepApp/SleepApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.mikolas.bedrival
        PRODUCT_NAME: SleepApp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
      configs:
        # Zápis do Zdraví jen v Debug (DebugHealthSeeder). Release o zápis nežádá (issue #8).
        Debug:
          GENERATE_INFOPLIST_FILE: YES
          INFOPLIST_KEY_NSHealthUpdateUsageDescription: Jen testovací build zapisuje do Apple Health vzorová data.
    info:
      path: SleepApp/Info.plist
      properties:
        CFBundleDisplayName: Bedrival
        # Launch screen v barvě pozadí appky (bg #0B0D12) s logem uprostřed, ať při startu nebliká bílá (#16).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: false
        # Jen HTTPS (standardní šifrování OS) – App Store Connect se pak neptá u každého buildu (#24).
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Čteme jen spánek a tep z hodinek nebo prstenu. Nic dalšího a nic do reklamy.
        SupabaseURL: $(SUPABASE_URL)
        SupabaseKey: $(SUPABASE_KEY)
  # UI testy (XCUITest): ruční test #13 a průchod appkou na promo video.
  SleepAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SleepAppUITests]
    dependencies:
      - target: SleepApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.mikolas.bedrival.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        TEST_TARGET_NAME: SleepApp
schemes:
  SleepApp:
    build:
      targets:
        SleepApp: all
        SleepAppUITests: [test]
    test:
      targets: [SleepAppUITests]
